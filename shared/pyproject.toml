[project]
name = "shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==24.1.0",
    "ddgs==9.13.0",
    "httpx==0.28.1",
    "rich",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
namespaces = true
where = ["."]
include = ["functions*"]
